<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" width="100%" height="100%" style="background:#090d12; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4AA" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="card-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c26" />
      <stop offset="100%" stop-color="#0c131a" />
    </linearGradient>
    <linearGradient id="card-accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 212, 170, 0.15)" />
      <stop offset="100%" stop-color="rgba(0, 212, 170, 0.02)" />
    </linearGradient>
    <linearGradient id="card-accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(139, 92, 246, 0.15)" />
      <stop offset="100%" stop-color="rgba(139, 92, 246, 0.02)" />
    </linearGradient>
    <linearGradient id="card-accent-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 165, 233, 0.15)" />
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.02)" />
    </linearGradient>

    <!-- Drop Shadows & Glows -->
    <filter id="glow-emerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#00D4AA" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8B5CF6" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
  </pattern>
  <rect width="1200" height="860" fill="url(#grid)" />

  <!-- HEADER -->
  <g transform="translate(60, 40)">
    <rect x="0" y="0" width="1080" height="60" rx="12" fill="#111822" stroke="rgba(0, 212, 170, 0.3)" filter="url(#shadow-card)" />
    <circle cx="35" cy="30" r="14" fill="#00D4AA" opacity="0.2" />
    <circle cx="35" cy="30" r="7" fill="#00D4AA" filter="url(#glow-emerald)" />
    <text x="65" y="36" fill="#ffffff" font-size="20" font-weight="700" letter-spacing="1">APTOS SYNAPSE <tspan fill="#00D4AA">ARCHITECTURE PIPELINE</tspan></text>
    <rect x="880" y="16" width="170" height="28" rx="14" fill="rgba(0, 212, 170, 0.1)" stroke="#00D4AA" stroke-width="1" />
    <text x="965" y="34" fill="#00D4AA" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">APTOS TESTNET • MOVE VM</text>
  </g>

  <!-- STAGE 1: CLIENT & TERMINAL HUD -->
  <g transform="translate(60, 130)">
    <!-- Stage Card -->
    <rect x="0" y="0" width="280" height="300" rx="14" fill="url(#card-dark)" stroke="rgba(255,255,255,0.08)" filter="url(#shadow-card)" />
    <rect x="0" y="0" width="280" height="42" rx="14" fill="url(#card-accent-emerald)" />
    <text x="20" y="26" fill="#00D4AA" font-size="12" font-weight="800" letter-spacing="1.5">STAGE 1: INTERACTION LAYER</text>

    <!-- Component 1: Cyberpunk HUD -->
    <rect x="18" y="56" width="244" height="68" rx="8" fill="#172230" stroke="rgba(0, 212, 170, 0.2)" />
    <text x="32" y="78" fill="#ffffff" font-size="13" font-weight="600">Terminal HUD (Port 3002)</text>
    <text x="32" y="96" fill="#94a3b8" font-size="10.5">3D Warp Grid • BIOS Boot Sequence</text>
    <text x="32" y="112" fill="#94a3b8" font-size="10.5">Real-Time Scramble Text Display</text>

    <!-- Component 2: Wallet Modal -->
    <rect x="18" y="134" width="244" height="68" rx="8" fill="#172230" stroke="rgba(255, 255, 255, 0.05)" />
    <text x="32" y="156" fill="#ffffff" font-size="13" font-weight="600">Ed25519 Web3 Identity</text>
    <text x="32" y="174" fill="#94a3b8" font-size="10.5">Modal Wallet Verification</text>
    <text x="32" y="190" fill="#00D4AA" font-size="10.5" font-family="monospace">0x0ef9...fc65 (Connected)</text>

    <!-- Component 3: Swarm Selectors -->
    <rect x="18" y="212" width="244" height="68" rx="8" fill="#172230" stroke="rgba(255, 255, 255, 0.05)" />
    <text x="32" y="234" fill="#ffffff" font-size="13" font-weight="600">Agent Selector Matrix</text>
    <text x="32" y="252" fill="#94a3b8" font-size="10.5">Configures 1 Lead + 2 Workers</text>
    <text x="32" y="268" fill="#38bdf8" font-size="10.5">Dynamic Dropdowns (6 Local LLMs)</text>
  </g>

  <!-- ARROW 1 -> 2 -->
  <path d="M 340 280 L 415 280" fill="none" stroke="#00D4AA" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <rect x="350" y="258" width="55" height="18" rx="4" fill="#090d12" stroke="rgba(0, 212, 170, 0.4)" />
  <text x="377" y="271" fill="#00D4AA" font-size="9" font-weight="700" text-anchor="middle">REST API</text>

  <!-- STAGE 2: SECURITY & GATEWAY LAYER -->
  <g transform="translate(425, 130)">
    <rect x="0" y="0" width="310" height="300" rx="14" fill="url(#card-dark)" stroke="rgba(255,255,255,0.08)" filter="url(#shadow-card)" />
    <rect x="0" y="0" width="310" height="42" rx="14" fill="url(#card-accent-blue)" />
    <text x="20" y="26" fill="#38bdf8" font-size="12" font-weight="800" letter-spacing="1.5">STAGE 2: SECURITY & GATEWAY</text>

    <!-- Component 1: Anti-Injection -->
    <rect x="18" y="56" width="274" height="68" rx="8" fill="#172230" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="32" y="78" fill="#ffffff" font-size="13" font-weight="600">InputSanitizer Engine</text>
    <text x="32" y="96" fill="#94a3b8" font-size="10.5">Delimiter Isolation: &lt;&lt;&lt;QUERY&gt;&gt;&gt;</text>
    <text x="32" y="112" fill="#38bdf8" font-size="10.5">Keyword Guard • Length Bounded ≤4000</text>

    <!-- Component 2: Auth Middleware -->
    <rect x="18" y="134" width="274" height="68" rx="8" fill="#172230" stroke="rgba(255, 255, 255, 0.05)" />
    <text x="32" y="156" fill="#ffffff" font-size="13" font-weight="600">Authentication & Whitelist</text>
    <text x="32" y="174" fill="#94a3b8" font-size="10.5">requireApiKey • requirePaymentAuth</text>
    <text x="32" y="190" fill="#94a3b8" font-size="10.5">Authorized Ed25519 Address Guard</text>

    <!-- Component 3: Rate Limiter & CORS -->
    <rect x="18" y="212" width="274" height="68" rx="8" fill="#172230" stroke="rgba(255, 255, 255, 0.05)" />
    <text x="32" y="234" fill="#ffffff" font-size="13" font-weight="600">RateLimiter & CORS Policy</text>
    <text x="32" y="252" fill="#94a3b8" font-size="10.5">Sliding-Window: 30 requests/min</text>
    <text x="32" y="268" fill="#94a3b8" font-size="10.5">Strict Origin Whitelist (Ports 3000-3002)</text>
  </g>

  <!-- ARROW 2 -> 3 -->
  <path d="M 735 280 L 810 280" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />
  <rect x="745" y="258" width="55" height="18" rx="4" fill="#090d12" stroke="rgba(56, 189, 248, 0.4)" />
  <text x="772" y="271" fill="#38bdf8" font-size="9" font-weight="700" text-anchor="middle">DISPATCH</text>

  <!-- STAGE 3: AI SWARM ORCHESTRATION -->
  <g transform="translate(820, 130)">
    <rect x="0" y="0" width="320" height="300" rx="14" fill="url(#card-dark)" stroke="rgba(255,255,255,0.08)" filter="url(#shadow-card)" />
    <rect x="0" y="0" width="320" height="42" rx="14" fill="url(#card-accent-purple)" />
    <text x="20" y="26" fill="#a855f7" font-size="12" font-weight="800" letter-spacing="1.5">STAGE 3: MULTI-AGENT SWARM</text>

    <!-- Lead Orchestrator -->
    <rect x="18" y="56" width="284" height="74" rx="8" fill="#172230" stroke="rgba(168, 85, 247, 0.4)" />
    <text x="32" y="78" fill="#ffffff" font-size="13" font-weight="600">Lead Orchestrator (Llama 3)</text>
    <text x="32" y="96" fill="#94a3b8" font-size="10.5">Task Decomposition & Vectoring</text>
    <text x="32" y="112" fill="#c084fc" font-size="10.5">Structured Regex Delegation Parser</text>

    <!-- Parallel Workers -->
    <rect x="18" y="140" width="284" height="140" rx="8" fill="#172230" stroke="rgba(255, 255, 255, 0.05)" />
    <text x="32" y="162" fill="#ffffff" font-size="13" font-weight="600">Concurrent Local LLMs (Ollama)</text>

    <!-- Sub-worker A -->
    <rect x="28" y="174" width="264" height="44" rx="6" fill="#101822" stroke="rgba(0, 212, 170, 0.3)" />
    <text x="40" y="192" fill="#00D4AA" font-size="11" font-weight="700">Worker B: Gemma 2B Agent</text>
    <text x="40" y="208" fill="#94a3b8" font-size="9.5">Technical & Architectural Analysis</text>

    <!-- Sub-worker B -->
    <rect x="28" y="226" width="264" height="44" rx="6" fill="#101822" stroke="rgba(56, 189, 248, 0.3)" />
    <text x="40" y="244" fill="#38bdf8" font-size="11" font-weight="700">Worker C: Mistral Agent</text>
    <text x="40" y="260" fill="#94a3b8" font-size="9.5">Security, Move VM & Consensus</text>
  </g>

  <!-- ARROW 3 -> 4 (Downward / Curve) -->
  <path d="M 980 430 L 980 495 L 685 495" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-purple)" />
  <rect x="795" y="485" width="85" height="20" rx="4" fill="#090d12" stroke="rgba(168, 85, 247, 0.4)" />
  <text x="837" y="499" fill="#c084fc" font-size="9" font-weight="700" text-anchor="middle">INFERENCE OUT</text>

  <!-- STAGE 4: EVALUATION & SETTLEMENT ENGINE -->
  <g transform="translate(60, 480)">
    <rect x="0" y="0" width="610" height="320" rx="14" fill="url(#card-dark)" stroke="rgba(255,255,255,0.08)" filter="url(#shadow-card)" />
    <rect x="0" y="0" width="610" height="42" rx="14" fill="url(#card-accent-emerald)" />
    <text x="20" y="26" fill="#00D4AA" font-size="12" font-weight="800" letter-spacing="1.5">STAGE 4: QUALITY EVALUATION & MICROPAYMENT ENGINE</text>

    <!-- Grid of Evaluation criteria -->
    <g transform="translate(20, 56)">
      <!-- Box 1: Multi-factor Evaluator -->
      <rect x="0" y="0" width="275" height="110" rx="8" fill="#172230" stroke="rgba(0, 212, 170, 0.3)" />
      <text x="14" y="24" fill="#ffffff" font-size="13" font-weight="600">Multi-Factor Quality Scorer</text>
      <text x="14" y="44" fill="#94a3b8" font-size="10.5">• Task relevance & semantic depth</text>
      <text x="14" y="60" fill="#94a3b8" font-size="10.5">• Technical syntax & keyword verification</text>
      <text x="14" y="76" fill="#94a3b8" font-size="10.5">• Structured paragraph organization</text>
      <text x="14" y="92" fill="#ef4444" font-size="10.5">• AI refusal penalty (-2.5pts)</text>

      <!-- Box 2: Quality Scores Output -->
      <rect x="295" y="0" width="275" height="110" rx="8" fill="#172230" stroke="rgba(0, 212, 170, 0.3)" />
      <text x="310" y="24" fill="#ffffff" font-size="13" font-weight="600">Verified Quality Scores</text>
      <text x="310" y="48" fill="#00D4AA" font-size="16" font-weight="800">Worker B: 8.7 / 10 <tspan fill="#94a3b8" font-size="11" font-weight="500">(Gemma)</tspan></text>
      <text x="310" y="74" fill="#38bdf8" font-size="16" font-weight="800">Worker C: 8.8 / 10 <tspan fill="#94a3b8" font-size="11" font-weight="500">(Mistral)</tspan></text>
      <text x="310" y="96" fill="#a855f7" font-size="10.5" font-weight="600">Strictly Bounded [1.0, 10.0]</text>
    </g>

    <!-- Box 3: Micropayment Allocation -->
    <rect x="20" y="180" width="570" height="118" rx="8" fill="#172230" stroke="rgba(255, 255, 255, 0.05)" />
    <text x="36" y="206" fill="#ffffff" font-size="13" font-weight="600">Autonomous Settlement Allocation (0.0100 APT Total Pool)</text>
    
    <!-- Visual Distribution Bar -->
    <rect x="36" y="222" width="260" height="24" rx="4" fill="#00D4AA" />
    <text x="166" y="238" fill="#090d12" font-size="10.5" font-weight="800" text-anchor="middle">Worker B: 0.00497 APT (50%)</text>

    <rect x="300" y="222" width="264" height="24" rx="4" fill="#0284c7" />
    <text x="432" y="238" fill="#ffffff" font-size="10.5" font-weight="800" text-anchor="middle">Worker C: 0.00503 APT (50%)</text>

    <text x="36" y="272" fill="#94a3b8" font-size="10.5">Settlement formula: </text>
    <text x="140" y="272" fill="#00D4AA" font-size="10.5" font-family="monospace">P_i = (Score_i / Sum(Scores)) × Pool</text>
    <text x="390" y="272" fill="#cbd5e1" font-size="10.5">Zero Arbitrary Overpayments</text>
  </g>

  <!-- ARROW 4 -> 5 -->
  <path d="M 670 640 L 735 640" fill="none" stroke="#00D4AA" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <rect x="680" y="618" width="45" height="18" rx="4" fill="#090d12" stroke="rgba(0, 212, 170, 0.4)" />
  <text x="702" y="631" fill="#00D4AA" font-size="9" font-weight="700" text-anchor="middle">COMMIT</text>

  <!-- STAGE 5: APTOS BLOCKCHAIN & MOVE CONTRACTS -->
  <g transform="translate(745, 480)">
    <rect x="0" y="0" width="395" height="320" rx="14" fill="url(#card-dark)" stroke="rgba(255,255,255,0.08)" filter="url(#shadow-card)" />
    <rect x="0" y="0" width="395" height="42" rx="14" fill="url(#card-accent-emerald)" />
    <text x="20" y="26" fill="#00D4AA" font-size="12" font-weight="800" letter-spacing="1.5">STAGE 5: APTOS MOVE ON-CHAIN LAYER</text>

    <!-- Contract 1: Memory Store -->
    <rect x="18" y="56" width="359" height="74" rx="8" fill="#172230" stroke="rgba(0, 212, 170, 0.3)" />
    <text x="32" y="78" fill="#ffffff" font-size="13" font-weight="600">memory_store.move</text>
    <text x="32" y="96" fill="#94a3b8" font-size="10.5">Entry: <tspan fill="#00D4AA" font-family="monospace">create_memory_v2</tspan></text>
    <text x="32" y="112" fill="#94a3b8" font-size="10.5">Stores cryptographic hash of agent response</text>

    <!-- Contract 2: Payment Manager -->
    <rect x="18" y="140" width="359" height="74" rx="8" fill="#172230" stroke="rgba(0, 212, 170, 0.3)" />
    <text x="32" y="162" fill="#ffffff" font-size="13" font-weight="600">payment_manager.move</text>
    <text x="32" y="180" fill="#94a3b8" font-size="10.5">Entry: <tspan fill="#00D4AA" font-family="monospace">pay_agents_batch</tspan></text>
    <text x="32" y="196" fill="#94a3b8" font-size="10.5">Atomic micro-coin settlement in Aptos Coin</text>

    <!-- Contract 3: Reputation & Explorer -->
    <rect x="18" y="224" width="359" height="74" rx="8" fill="#172230" stroke="rgba(255, 255, 255, 0.05)" />
    <text x="32" y="246" fill="#ffffff" font-size="13" font-weight="600">memory_reputation.move & Explorer</text>
    <text x="32" y="264" fill="#94a3b8" font-size="10.5">Decentralized reputation counters</text>
    <text x="32" y="280" fill="#00D4AA" font-size="10.5" font-family="monospace">explorer.aptoslabs.com/account/0x945d...ab43</text>
  </g>

  <!-- FEEDBACK LOOP LINE (Blockchain back to Client HUD) -->
  <path d="M 942 800 L 942 830 L 200 830 L 200 435" fill="none" stroke="rgba(0, 212, 170, 0.4)" stroke-width="1.8" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <rect x="490" y="820" width="220" height="20" rx="6" fill="#090d12" stroke="rgba(0, 212, 170, 0.3)" />
  <text x="600" y="834" fill="#00D4AA" font-size="9.5" font-weight="700" text-anchor="middle">REAL-TIME VERIFICATION & HUD REVEAL</text>
</svg>
